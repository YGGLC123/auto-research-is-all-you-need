<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__TITLE__</title>
    <script>
      // Pick the theme before first paint, so a dark-mode reader never sees a white flash.
      (function () {
        var mode = null;
        try { mode = localStorage.getItem("ar-map-theme"); } catch (e) {}
        var dark = mode ? mode === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="application/json" id="map-data">__DATA__</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
